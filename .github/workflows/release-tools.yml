name: Release • Tools

on:
  push:
    tags:
      - "vacs-data-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (1.2.3, v1.2.3, or vacs-data-v1.2.3)"
        required: true
        type: string
      ref:
        description: "Git ref to build (branch/tag/SHA). Empty = default branch tip."
        required: false
        default: ""
        type: string

permissions: {}

# Never cancel a half-finished release.
concurrency:
  group: release-tools-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: tools

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      draft: ${{ steps.vars.outputs.draft }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      release_name: ${{ steps.vars.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve version & tag
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW="${INPUT_VERSION}"
          else
            RAW="${GITHUB_REF_NAME}"  # e.g. vacs-data-v1.2.3
          fi

          # Extract X.Y.Z from: 1.2.3 | v1.2.3 | vacs-data-v1.2.3 | 1.2.3-rc.1
          if [[ "$RAW" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?) ]]; then
            VER="${BASH_REMATCH[1]}"
          else
            echo "Could not parse semver from: $RAW" >&2
            exit 1
          fi

          TAG="vacs-data-v${VER}"
          REL_NAME="vacs-data: v${VER}"

          # Draft release when manual; published on tag-push
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DRAFT=true
          else
            DRAFT=false
          fi

          # Mark prerelease if version contains a prerelease part (e.g., -rc.1)
          if [[ "$VER" =~ -[A-Za-z0-9] ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=$VER"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=$REL_NAME" >> "$GITHUB_OUTPUT"

  generate-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Generate a changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: tools/cliff.toml
          args: -vv --latest --no-exec --github-repo ${{ github.repository }}

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Keep the version pin in step with vacs' release-client.yml.
      - name: Install cargo-about
        run: cargo install cargo-about --features=cli --locked --version 0.9.2

      - name: Generate third-party license file
        run: cargo about generate --workspace -o THIRD_PARTY_LICENSES.html about.hbs

      - name: Upload licenses artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: tools/THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [prep]
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # No cargo cache restore in release builds: caches are writable by ordinary CI
      # runs, and a poisoned cache would end up inside attested artifacts.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Set binary name
        id: vars
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          EXT=""
          if [[ "$PLATFORM" == *"windows"* ]]; then
            EXT=".exe"
          fi

          echo "binary_name=vacs-data$EXT" >> "$GITHUB_OUTPUT"
          echo "release_binary_name=vacs-data-${VERSION}-${PLATFORM}$EXT" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: cargo build --release --locked --bin vacs-data --target ${{ matrix.target }}

      - name: Rename binary to include platform
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ steps.vars.outputs.binary_name }}
          RELEASE_BINARY_NAME: ${{ steps.vars.outputs.release_binary_name }}
        run: |
          mv "target/$TARGET/release/$BINARY_NAME" "target/$TARGET/release/$RELEASE_BINARY_NAME"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vacs-data-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            tools/target/${{ matrix.target }}/release/${{ steps.vars.outputs.release_binary_name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: tools
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest build provenance
        if: ${{ !github.event.repository.private || github.event.repository.owner.type == 'Organization' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            tools/target/${{ matrix.target }}/release/${{ steps.vars.outputs.release_binary_name }}

      - name: Attest SBOM
        if: ${{ !github.event.repository.private || github.event.repository.owner.type == 'Organization' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            tools/target/${{ matrix.target }}/release/${{ steps.vars.outputs.release_binary_name }}
          sbom-path: sbom.spdx.json

  release:
    # Dispatch runs create a draft release, matching release-client in the vacs repo.
    needs: [prep, generate-changelog, build, licenses]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: vacs-data-*
          merge-multiple: true

      - name: Download license file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses
          path: dist

      - name: Generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          out="SHA256SUMS-${VERSION}.txt"
          : > "$out"
          for f in *; do
            [[ "$f" == SHA256SUMS* || "$f" == *.html ]] && continue
            sum=$(shasum -a 256 "$f" | cut -d' ' -f1)
            echo "$sum  $f" >> "$out"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums using Cosign with GitHub OIDC Token
        working-directory: dist
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "SHA256SUMS-${VERSION}.txt.bundle.json" \
            "SHA256SUMS-${VERSION}.txt"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-${{ needs.prep.outputs.version }}.txt

      - name: Create/update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prep.outputs.tag }}
          RELEASE_NAME: ${{ needs.prep.outputs.release_name }}
          DRAFT: ${{ needs.prep.outputs.draft }}
          PRERELEASE: ${{ needs.prep.outputs.prerelease }}
          RELEASE_BODY: ${{ needs.generate-changelog.outputs.release_body }}
        run: |
          cat > /tmp/release-notes.md <<'BODY_EOF'
          $RELEASE_BODY
          BODY_EOF

          args=(--title "$RELEASE_NAME" --notes-file /tmp/release-notes.md)
          [[ "$DRAFT" == "true" ]] && args+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          if [[ "$DRAFT" == "false" && "$PRERELEASE" == "false" ]]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
            gh release upload "$TAG" dist/** --clobber
          else
            gh release create "$TAG" dist/** "${args[@]}"
          fi

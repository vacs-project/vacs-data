name: Sync AIRAC Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/airac-cycles.yml"
  schedule:
    - cron: "0 6 * * 1" # Every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      max_upcoming:
        description: "Number of upcoming AIRAC cycles to create labels for"
        required: false
        type: number
        default: 4

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: airac-bot
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/airac-cycles.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vacs-data
          # Labels go through the issues API.
          permission-issues: write
          permission-pull-requests: read

      - name: Sync labels
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          MAX_UPCOMING: ${{ inputs.max_upcoming || 4 }}
        shell: bash
        run: |
          LABEL_COLOR="DC521D"
          TODAY=$(date -u +%Y-%m-%d)
          echo "Syncing AIRAC labels (today: $TODAY, max upcoming: $MAX_UPCOMING)..."

          mapfile -t LABELS < <(gh label list --json name --jq '.[].name' 2>/dev/null)
          has_label() { [[ " ${LABELS[*]} " == *" $1 "* ]]; }

          # Collect upcoming cycle dates (on or after today), sorted
          upcoming=()
          while IFS=: read -r date cycle_raw; do
            [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
            if [[ ! "$date" < "$TODAY" ]]; then
              upcoming+=("$date")
            fi
          done < .github/airac-cycles.yml

          # Keep only the next N upcoming cycles
          upcoming=("${upcoming[@]:0:$MAX_UPCOMING}")

          # Now process all entries
          while IFS=: read -r date cycle_raw; do
            [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
            cycle=$(echo "$cycle_raw" | tr -d ' "')
            label="airac/$cycle"

            if [[ " ${upcoming[*]} " == *" $date "* ]]; then
              # Create/update labels only for the next N upcoming cycles
              description="AIRAC $cycle - effective $date"
              gh label create "$label" --color "$LABEL_COLOR" --description "$description" --force
              echo "Synced label: $label"
            elif has_label "$label"; then
              # Delete anything past its effective date if no open PRs reference it
              open_prs=$(gh pr list --label "$label" --state open --json number --jq 'length')
              if [[ "$open_prs" -eq 0 ]]; then
                echo "Deleting expired label: $label (cycle date: $date)"
                gh label delete "$label" --yes
              else
                echo "Keeping expired label: $label ($open_prs open PRs)"
              fi
            fi
          done < .github/airac-cycles.yml

          echo "### ✅ AIRAC labels synced" >> "$GITHUB_STEP_SUMMARY"

name: Deploy Dataset

on:
  push:
    branches: [main]
    paths:
      - "dataset/**"
    tags:
      - "airac-[0-9][0-9][0-9][0-9]"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - production

permissions: {}

jobs:
  validate:
    name: Validate dataset
    uses: ./.github/workflows/ci-dataset.yml
    permissions:
      contents: read

  deploy-dev:
    name: Deploy to dev
    needs: validate
    timeout-minutes: 10
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.VACS_SERVER_URL }}
    permissions:
      id-token: write
    steps:
      - name: Checkout actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy dataset
        uses: ./.github/actions/deploy-dataset
        with:
          oidc-audience: ${{ vars.VACS_OIDC_AUDIENCE }}
          server-url: ${{ vars.VACS_SERVER_URL }}
          git-ref: ${{ github.ref }}
          commit-sha: ${{ github.sha }}
          deployed-tag: "deployed/dev"

      - name: Summary
        env:
          SERVER_URL: ${{ vars.VACS_SERVER_URL }}
        run: |
          echo "## ✅ Deployed to dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | $GITHUB_EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`deployed/dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | $SERVER_URL |" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to production
    needs: validate
    timeout-minutes: 10
    # Deliberate: pushes to main deploy straight to production. The AIRAC merge gate
    # controls timing (cycle-bound PRs cannot merge before their effective date), so
    # main is always deployable; the airac-* tag re-deploys when a cycle turns
    # effective.
    if: >-
      (github.event_name == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.VACS_SERVER_URL }}
    permissions:
      id-token: write
    steps:
      # Branch pushes carry no cycle to validate; every tag-triggered production
      # deploy must pass this check.
      - name: Validate AIRAC cycle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/airac-')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CYCLE="${GITHUB_REF_NAME#airac-}"
          echo "Validating AIRAC cycle: $CYCLE"

          # Fetch the cycles file directly from the repo (no full checkout needed)
          CYCLES=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://raw.githubusercontent.com/$GH_REPO/$GITHUB_SHA/.github/airac-cycles.yml")

          if echo "$CYCLES" | grep -qF "\"${CYCLE}\""; then
            echo "AIRAC cycle $CYCLE is valid"
          else
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match a known AIRAC cycle"
            exit 1
          fi

      - name: Checkout actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy dataset
        uses: ./.github/actions/deploy-dataset
        with:
          oidc-audience: ${{ vars.VACS_OIDC_AUDIENCE }}
          server-url: ${{ vars.VACS_SERVER_URL }}
          git-ref: ${{ github.ref }}
          commit-sha: ${{ github.sha }}
          deployed-tag: "deployed/production"

      - name: Summary
        env:
          SERVER_URL: ${{ vars.VACS_SERVER_URL }}
        run: |
          echo "## ✅ Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | $GITHUB_EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`$GITHUB_REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`deployed/production\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | $SERVER_URL |" >> $GITHUB_STEP_SUMMARY

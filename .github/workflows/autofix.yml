name: autofix.ci

# SECURITY: this workflow runs code from fork PRs (npm lifecycle scripts, prettier
# plugins from the PR's lockfile). It must NEVER be given secrets or write
# permissions; the fix commit is applied by the trusted autofix.ci app, which only
# accepts diffs produced by this workflow.
on:
  pull_request:
    paths:
      - "dataset/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/autofix.yml"
  push:
    branches: ["main"]
    paths:
      - "dataset/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/autofix.yml"

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format dataset
        run: npm run format

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore(dataset): format with prettier"
